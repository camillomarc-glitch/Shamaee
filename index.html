<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday, My Shamaeeeee ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background: linear-gradient(135deg, #ffd6e7, #fff0f6, #ffe5ef);
    color: #5b3544;
}

/* ==============================
   EDITABLE CONTENT
   ============================== */

:root {
    --pink: #e75480;
    --light-pink: #ffd9e6;
    --dark-pink: #c93668;
}

/* PAGE SYSTEM */

.page {
    min-height: 100vh;
    width: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 25px;
    position: relative;
}

.page.active {
    display: flex;
}

/* ==============================
   FIRST PAGE
   ============================== */

.intro-card {
    width: 100%;
    max-width: 500px;
    background: rgba(255,255,255,0.92);
    border-radius: 30px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(150, 50, 90, 0.2);
    animation: cardAppear 1.2s ease;
    position: relative;
    z-index: 2;
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(40px) scale(.9);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.cake {
    font-size: 70px;
    animation: cakeBounce 1.5s infinite;
}

@keyframes cakeBounce {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}

.intro-title {
    font-size: clamp(38px, 10vw, 60px);
    color: var(--pink);
    margin: 10px 0;
    animation: titleGlow 2s infinite alternate;
}

@keyframes titleGlow {
    from {
        text-shadow: 0 0 5px #ffb5ca;
    }

    to {
        text-shadow: 0 0 20px #ff82a7;
    }
}

.intro-subtitle {
    font-size: 20px;
    margin: 10px 0 20px;
}

.photo-frame {
    width: 220px;
    height: 220px;
    margin: 20px auto;
    padding: 7px;
    border-radius: 50%;
    background: linear-gradient(45deg,#ff76a5,#ffd166,#ff76a5);
    animation: photoFloat 3s ease-in-out infinite;
}

@keyframes photoFloat {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

.photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    background: #fff;
}

.small-message {
    font-size: 16px;
    line-height: 1.7;
    margin: 15px 0;
}

.open-button {
    border: none;
    background: linear-gradient(135deg,#e75480,#ff8aae);
    color: white;
    font-size: 17px;
    font-weight: bold;
    padding: 16px 30px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(231,84,128,.3);
    transition: .3s;
    margin-top: 15px;
}

.open-button:hover {
    transform: scale(1.07);
}

/* ==============================
   SECOND PAGE
   ============================== */

.letter-page {
    align-items: flex-start;
    padding-top: 40px;
}

.letter-card {
    width: 100%;
    max-width: 700px;
    background: rgba(255,255,255,.95);
    border-radius: 30px;
    padding: 35px 30px;
    box-shadow: 0 20px 60px rgba(130,40,70,.2);
    animation: letterOpen 1.3s ease;
    position: relative;
    z-index: 2;
}

@keyframes letterOpen {
    from {
        opacity: 0;
        transform: scale(.8) rotateX(15deg);
    }

    to {
        opacity: 1;
        transform: scale(1) rotateX(0);
    }
}

.letter-title {
    text-align: center;
    color: var(--pink);
    font-size: 35px;
    margin-bottom: 10px;
}

.letter-to {
    text-align: center;
    font-size: 20px;
    margin-bottom: 25px;
}

.letter-photo {
    width: 180px;
    height: 180px;
    margin: 0 auto 25px;
}

.letter-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,.15);
}

.letter-content {
    background: #fff8fb;
    border-radius: 20px;
    padding: 25px;
    line-height: 1.9;
    font-size: 17px;
    white-space: pre-line;
    text-align: left;
}

.signature {
    text-align: right;
    margin-top: 25px;
    color: var(--dark-pink);
    font-size: 19px;
    font-weight: bold;
}

.back-button {
    display: block;
    margin: 25px auto 0;
    border: none;
    background: #ffe0eb;
    color: #c93668;
    padding: 12px 25px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 15px;
}

/* ==============================
   FLOATING HEARTS
   ============================== */

.heart {
    position: fixed;
    bottom: -40px;
    pointer-events: none;
    animation: floatHeart linear forwards;
    z-index: 1;
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) rotate(0);
        opacity: 0;
    }

    20% {
        opacity: .8;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* ==============================
   CONFETTI
   ============================== */

.confetti {
    position: fixed;
    width: 9px;
    height: 15px;
    top: -20px;
    z-index: 10;
    animation: confettiFall 4s linear forwards;
}

@keyframes confettiFall {
    to {
        transform: translateY(110vh) rotate(720deg);
    }
}

/* MOBILE */

@media(max-width:600px) {

    .page {
        padding: 15px;
    }

    .intro-card,
    .letter-card {
        padding: 25px 18px;
    }

    .photo-frame {
        width: 190px;
        height: 190px;
    }

    .letter-content {
        font-size: 16px;
        padding: 20px;
    }
}

</style>
</head>

<body>


<!-- =====================================================
     PAGE 1 — BIRTHDAY INTRO
     ===================================================== -->

<section id="page1" class="page active">

    <div class="intro-card">

        <div class="cake">🎂</div>

        <h1 class="intro-title">
            Happy Birthday! 🎉
        </h1>

        <p class="intro-subtitle">
            To my beautiful <span id="introName"></span> ❤️
        </p>

        <div class="photo-frame">
            <img id="introPhoto" src="Shamaee.jpg" alt="Birthday Photo">
        </div>

        <p class="small-message">
            Today is your special day... 💕
            <br>
            I prepared a little surprise just for you.
        </p>

        <button class="open-button" onclick="openLetter()">
            💌 Open My Surprise
        </button>

    </div>

</section>


<!-- =====================================================
     PAGE 2 — LETTER
     ===================================================== -->

<section id="page2" class="page letter-page">

    <div class="letter-card">

        <h1 class="letter-title">
            💌 A Birthday Letter
        </h1>

        <p class="letter-to">
            For my Dungo, <strong id="letterName"></strong> ❤️
        </p>

        <div class="letter-photo">
            <img id="letterPhoto" src="Shamaee.jpg" alt="Her Photo">
        </div>

        <div class="letter-content" id="letterMessage">
        </div>

        <div class="signature">
            With all my love ❤️<br>
            Your Mr. Shonget
        </div>

        <button class="back-button" onclick="goBack()">
            ← Back
        </button>

    </div>

</section>


<script>

/* =========================================================
   ❤️ EDIT HERE — YOUR PERSONAL INFORMATION
   ========================================================= */

const birthdayData = {

    // HER NAME
    name: "Trisha May D. Bandong",

    // IMAGE FILE
    // Put your image in the SAME FOLDER as this HTML file.
    // Example:
    // birthday.html
    // baby.jpg
    image: "Shamaee.jpg",

    // YOUR FIRST PAGE MESSAGE
    introMessage:
        "Today is your special day... 💕\nI prepared a little surprise just for you.",

    // YOUR BIRTHDAY LETTER
    message:
`Happy Birthday, Shamaaeeee! ❤️

Today is a very special day because it is the day you were born.

I just want you to know how thankful I am to have you in my life. You are such a wonderful and special person, and I hope you always remember how loved and appreciated you are.

On your birthday, I wish you happiness, good health, success, and that all the dreams in your heart slowly become reality.

I hope today brings you lots of smiles, laughter, and beautiful memories that you can keep forever.

No matter how busy life gets, I hope you always take time to appreciate yourself and how far you've come.

Enjoy your special day, baby. You deserve all the happiness in the world.

Happy Birthday once again! 🎂❤️

I love you and I'm always cheering for you. 💕`,

};


/* =========================================================
   LOAD INFORMATION
   ========================================================= */

document.getElementById("introName").textContent =
    birthdayData.name;

document.getElementById("letterName").textContent =
    birthdayData.name;

document.getElementById("introPhoto").src =
    birthdayData.image;

document.getElementById("letterPhoto").src =
    birthdayData.image;

document.getElementById("letterMessage").textContent =
    birthdayData.message;


/* =========================================================
   OPEN LETTER
   ========================================================= */

function openLetter() {

    document.getElementById("page1")
        .classList.remove("active");

    document.getElementById("page2")
        .classList.add("active");

    createConfetti();

    playBirthdayMusic();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   BACK BUTTON
   ========================================================= */

function goBack() {

    document.getElementById("page2")
        .classList.remove("active");

    document.getElementById("page1")
        .classList.add("active");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   FLOATING HEARTS
   ========================================================= */

function createHeart() {

    const heart =
        document.createElement("div");

    heart.className = "heart";

    const heartList = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "🌸",
        "✨"
    ];

    heart.textContent =
        heartList[
            Math.floor(
                Math.random() * heartList.length
            )
        ];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 20) + "px";

    heart.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 10000);
}

setInterval(createHeart, 700);


/* =========================================================
   CONFETTI
   ========================================================= */

function createConfetti() {

    for(let i = 0; i < 100; i++) {

        const confetti =
            document.createElement("div");

        confetti.className =
            "confetti";

        confetti.style.left =
            Math.random() * 100 + "vw";

        confetti.style.background =
            `hsl(${Math.random() * 360}, 80%, 65%)`;

        confetti.style.animationDelay =
            Math.random() * 1.5 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 5000);
    }
}


/* =========================================================
   🎵 SIMPLE BIRTHDAY MELODY
   ========================================================= */

function playBirthdayMusic() {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) return;

    const audio =
        new AudioContext();

    const notes = [
        262, 262, 294, 262,
        349, 330,
        262, 262, 294, 262,
        392, 349
    ];

    notes.forEach((frequency, index) => {

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.type = "sine";

        oscillator.frequency.value =
            frequency;

        oscillator.connect(gain);

        gain.connect(audio.destination);

        const time =
            audio.currentTime +
            index * .35;

        gain.gain.setValueAtTime(
            .001,
            time
        );

        gain.gain.exponentialRampToValueAtTime(
            .2,
            time + .03
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            time + .32
        );

        oscillator.start(time);

        oscillator.stop(time + .35);

    });

}

</script>
